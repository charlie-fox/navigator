  <header class="header"><div class="header-in"><h1>个人导航</h1><form class="search" id="searchForm" role="search"><div class="search-box"><input id="searchInput" type="search" autocomplete="off" placeholder="搜索服务、用途或标签，例如：网盘、视频、代码" aria-label="搜索站内服务"><span aria-hidden="true">⌕</span></div><button class="external" type="submit" data-engine="bing">Bing 搜索 ↗</button><button class="external" type="submit" data-engine="google">Google 搜索 ↗</button></form></div></header>
  <div class="layout"><aside class="sidebar" aria-label="服务分类"><nav class="nav"><span class="nav-title">服务分类</span><div class="nav-list" id="categoryNav"></div></nav><p class="hint">输入关键词会搜索服务名、简介和标签。点击 ☆ 可将服务固定到“收藏”。</p></aside><main id="main" tabindex="-1"><div class="collections"><section class="collection" id="favoritesBox" hidden><div class="head"><h2>★ 收藏</h2><span>你的常用入口</span></div><div class="compact" id="favorites"></div></section><section class="collection" id="recentBox" hidden><div class="head"><h2>🕘 最近访问</h2><span>仅保存在此浏览器</span></div><div class="compact" id="recent"></div></section></div><p class="summary" id="summary" aria-live="polite"></p><div id="sections"></div><div class="empty" id="empty">没有找到匹配服务。试试更宽泛的词，或清空搜索。</div></main></div>
  <script>
    function initNavigator(data){
    const {categories,services}=data;
    const RECENT_LIMIT=12;
    const load=key=>{try{return JSON.parse(localStorage.getItem(key))||[]}catch{return[]}},save=(key,value)=>localStorage.setItem(key,JSON.stringify(value));
    const state={category:'all',query:'',favorites:load('navigator-favorites'),recent:load('navigator-recent')},byId=new Map(services.map(s=>[s.id,s]));
    const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const match=s=>!state.query||[s.name,s.description,...s.tags].join(' ').toLowerCase().includes(state.query.toLowerCase());
    function card(s,compact=false){const liked=state.favorites.includes(s.id);return `<article class="card" data-id="${s.id}"><a class="card-link" href="${s.url}" target="_blank" rel="noopener noreferrer" aria-label="打开 ${esc(s.name)}（新窗口）"><span class="name">${esc(s.name)}</span><span class="desc">${esc(s.description)}</span><span class="tags">${s.tags.slice(0,compact?1:3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</span></a><button class="favorite" type="button" data-favorite="${s.id}" aria-label="${liked?'取消收藏':'收藏'} ${esc(s.name)}" aria-pressed="${liked}">${liked?'★':'☆'}</button></article>`}
    function renderNav(){const all=[{id:'all',icon:'◈',name:'全部服务',count:services.length},...categories.map(c=>({...c,count:services.filter(s=>s.category===c.id).length}))];$('#categoryNav').innerHTML=all.map(c=>`<button type="button" data-category="${c.id}" aria-pressed="${state.category===c.id}"><span>${c.icon} ${c.name}</span><small>${c.count}</small></button>`).join('')}
    function collection(ids,grid,box){const items=ids.map(id=>byId.get(id)).filter(Boolean);box.hidden=!items.length;grid.innerHTML=items.map(s=>card(s,true)).join('')}
    function render(){renderNav();collection(state.favorites,$('#favorites'),$('#favoritesBox'));collection(state.recent,$('#recent'),$('#recentBox'));let count=0;$('#sections').innerHTML=categories.map(c=>{const items=services.filter(s=>s.category===c.id&&match(s)),selected=state.category==='all'||state.category===c.id;if(selected)count+=items.length;return `<section class="section" id="category-${c.id}" ${!selected||!items.length?'hidden':''}><div class="head"><h2>${c.icon} ${c.name}</h2><p>${c.description} · ${items.length} 项</p></div><div class="grid">${items.map(s=>card(s)).join('')}</div></section>`}).join('');const filtered=state.query||state.category!=='all';$('#summary').textContent=filtered?`找到 ${count} 项服务${state.query?`，匹配“${state.query}”`:''}`:'';$('#empty').classList.toggle('show',count===0)}
    $('#categoryNav').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;state.category=b.dataset.category;render();$(state.category==='all'?'#main':`#category-${state.category}`)?.scrollIntoView({behavior:'smooth',block:'start'})});
    document.addEventListener('click',e=>{const f=e.target.closest('[data-favorite]');if(f){e.preventDefault();e.stopPropagation();const id=f.dataset.favorite;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[id,...state.favorites];save('navigator-favorites',state.favorites);render();return}const link=e.target.closest('.card[data-id]');if(link){state.recent=[link.dataset.id,...state.recent.filter(x=>x!==link.dataset.id)].slice(0,RECENT_LIMIT);save('navigator-recent',state.recent)}});
    $('#searchInput').addEventListener('input',e=>{state.query=e.target.value.trim();render()});$('#searchForm').addEventListener('submit',e=>{e.preventDefault();const q=$('#searchInput').value.trim(),base=e.submitter?.dataset.engine==='google'?'https://www.google.com/search?q=':'https://www.bing.com/search?q=';if(q)window.open(base+encodeURIComponent(q),'_blank','noopener')});render();
    }
    document.addEventListener('DOMContentLoaded',()=>initNavigator(JSON.parse(document.querySelector('#navigator-data').textContent)));
  </script>
